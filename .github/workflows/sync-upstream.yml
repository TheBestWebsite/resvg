# .github/workflows/sync-upstream.yml
name: Sync with upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          repository: linebender/resvg
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_SIGNING_KEY }}" > ~/.ssh/ci_signing_key
          chmod 600 ~/.ssh/ci_signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/ci_signing_key
          git config --global commit.gpgsign true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add downstream remote
        run: git remote add downstream https://github.com/TheBestWebsite/resvg-aarch64.git

      - name: Replace v0.47.0
        run: git tag -d v0.47.0

      - name: Fetch downstream (including all tags)
        run: git fetch downstream --tags

      - name: Rebase onto downstream
        run: |
          git checkout main
          git rebase downstream/main
          git push --force-with-lease downstream main

      - name: Push tags to your fork
        run: git push downstream --tags
